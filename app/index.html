<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get Verbi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5532BD">
<link rel="icon" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>
  // One link for every device (Instagram bio, stories, QR codes): iPhone and
  // iPad go to the App Store, Android to Google Play, anything else stays on
  // this page with both badges. ?s=<source> names the campaign, default
  // instagram_bio. Runs before the body so phones never see the page.
  (function () {
    // App Store Connect campaign provider token; empty until the founder
    // creates one (same constant as web/site/index.html and the invite page).
    var PT = '';
    var raw = new URLSearchParams(location.search).get('s') || '';
    var source = /^[a-z0-9_]{1,40}$/.test(raw) ? raw : 'instagram_bio';
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    var appStore = PT
      ? 'https://apps.apple.com/app/apple-store/id6752242891?pt=' + encodeURIComponent(PT) + '&ct=' + source + '&mt=8'
      : 'https://apps.apple.com/app/verbi/id6752242891';
    // Google Play hands the referrer to the app on install (GA4 reads it).
    var play = 'https://play.google.com/store/apps/details?id=com.monurilgaz.verbi&referrer=' +
      encodeURIComponent('utm_source=' + source + '&utm_medium=link');
    window.VERBI_STORE = {appStore: appStore, play: play};
    if (ios) location.replace(appStore);
    else if (android) location.replace(play);
  })();
</script>
<style>
  :root {
    --stage: #5532BD;
    --ink: #1D1436;
    --paper: #FBFAFE;
    --muted: #6B6784;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #EFEDF8; --paper: #120D24; --muted: #A39FBD; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--font);
    padding: 24px 16px; text-align: center;
  }
  main { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .icon { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 18px 40px -18px rgba(29, 20, 54, .55); }
  h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 10px; }
  .badges img { height: 48px; width: auto; display: block; }
  .home { margin-top: 8px; color: var(--stage); font-weight: 600; text-decoration: none; }
  @media (prefers-color-scheme: dark) { .home { color: #A992FF; } }
</style>
</head>
<body>
<main>
  <img class="icon" src="/assets/icon-512.webp" alt="" width="88" height="88">
  <h1>Verbi</h1>
  <p data-i18n="lede">Record meetings and lectures; Verbi writes them down and summarizes them.</p>
  <div class="badges">
    <a id="ios" href="https://apps.apple.com/app/verbi/id6752242891"><img data-badge="app-store" src="/assets/app-store-badge-en.svg" alt="Download on the App Store"></a>
    <a id="android" href="https://play.google.com/store/apps/details?id=com.monurilgaz.verbi&amp;referrer=utm_source%3Dinstagram_bio%26utm_medium%3Dlink"><img data-badge="google-play" src="/assets/google-play-badge-en.png" alt="Get it on Google Play"></a>
  </div>
  <a class="home" href="/" data-i18n="home">theverbi.com</a>
</main>
<script>
  // Desktop (or a redirect that did not happen): the links carry the source too.
  document.getElementById('ios').href = window.VERBI_STORE.appStore;
  document.getElementById('android').href = window.VERBI_STORE.play;
  if (/^tr\b/i.test(navigator.language || '')) {
    document.documentElement.lang = 'tr';
    document.title = "Verbi'yi indir";
    document.querySelector('[data-i18n=lede]').textContent = 'Toplantılarını ve derslerini kaydet; Verbi yazıya döker ve özetler.';
    document.querySelector('[data-badge=app-store]').src = '/assets/app-store-badge-tr.svg';
    document.querySelector('[data-badge=app-store]').alt = "App Store'dan indirin";
    document.querySelector('[data-badge=google-play]').src = '/assets/google-play-badge-tr.png';
    document.querySelector('[data-badge=google-play]').alt = "Google Play'den alın";
  }
</script>
</body>
</html>
